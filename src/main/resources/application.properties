spring.application.name=RopaStoreFinal
server.port=8080

spring.datasource.url=jdbc:h2:file:./data/tiendadb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true

spring.datasource.hikari.pool-name=TiendaHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

spring.jpa.hibernate.ddl-auto=update

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

spring.jackson.deserialization.fail-on-null-for-primitives=false

# la clave del JWT debe tener al menos 32 caracteres, en un proyecto real estos valores irían en variables de entorno, no en el archivo.
app.jwt.secret=ropastore-clave-secreta-super-larga-para-jwt-2026 
app.jwt.expiracion-minutos=60
app.admin.correo=admin@ropastore.cl
app.admin.password=admin1234